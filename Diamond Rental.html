const girls=()=>{
  const catalog=new Map(S.custom.filter(g=>g.catalogKey).map(g=>[g.catalogKey,g]));
  return BASE.map(g=>{
    const linked=catalog.get(g.id);
    return linked?{...g,backendId:linked.id,profileType:linked.profileType}:g;
  }).concat(S.custom.filter(g=>!g.catalogKey));

const getG=id=>girls().find(g=>g.id===id||g.backendId===id);
const sameRenter=(a,b)=>{
  const left=getG(a),right=getG(b);
  return a===b||!!left&&!!right&&left.id===right.id;
};
const imgOf=g=>S.imgs[g.id]||IMG[g.id]||"";
const bg=g=>{const u=imgOf(g);return u?`background-image:url('${u}')`:`background-image:linear-gradient(135deg,${g.color},#2a2140)`};
const revs=id=>(SEED_REV[id]||[]).concat(S.reviews[id]||[]);
const avg=id=>{const r=revs(id);return r.length?r.reduce((a,b)=>a+b.r,0)/r.length:0};
const doneN=id=>S.orders.filter(o=>sameRenter(o.id,id)&&o.status==="done").reduce((a,o)=>a+o.sessions.length,0);
const rents=id=>(SEED_RENTS[id]||0)+doneN(id);
const score=id=>+(avg(id)*20+rents(id)*2).toFixed(1);
const stars=r=>"★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r));
function level(id){const n=rents(id);return n>=30?"lv4":n>=15?"lv3":n>=5?"lv2":"lv"}
const PROMO={};
function eff(g){return{section:g.section,price:SECTIONS[g.section].price,promoted:false}}
function spent(){return S.orders.filter(o=>o.status!=="cancelled").reduce((a,o)=>a+o.total,0)}
function vipTier(){const s=spent();let r=VIPS[0];for(const v of VIPS)if(s>=v.min)r=v;return r}
function fileImg(max,cb){
  const i=document.createElement("input");i.type="file";i.accept="image/*";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.82))};im.onerror=()=>toast("Image error");im.src=rd.result};
    rd.readAsDataURL(f)};
  i.click();
}
function copyText(txt,el){
  const fb=()=>{if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast(t("copyfail"))};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fb)}catch(e){fb()}
}

/* ================= AVAILABILITY ================= */
function nowP(){const n=new Date();return{d:n.getFullYear()+"-"+p2(n.getMonth()+1)+"-"+p2(n.getDate()),h:n.getHours()+n.getMinutes()/60}}
function busy(id,d,h){let x=7;const s=id+d+h;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x%6===0}
function mine(id,d,h){return S.orders.some(o=>sameRenter(o.id,id)&&o.status!=="cancelled"&&o.sessions.some(s=>s.d===d&&h>=+s.t.slice(0,2)&&h<+s.t.slice(0,2)+o.hours))}
function slotsFor(g,d,hours,self){
  const a=g.avail,np=nowP(),out=[];
  if(!a.days.includes(new Date(d+"T00:00:00").getDay()))return{closed:true,out};
  for(let h=a.from;h+hours<=a.to;h++){
    let why="";
    if(d<np.d||(d===np.d&&h<=np.h))why="x";
    for(let x=h;x<h+hours&&!why;x++)if(busy(g.id,d,x)||mine(g.id,d,x))why="x";
    if(!why&&ck&&ck.sessions.some((s,i)=>i!==self&&s.d===d&&s.t&&h<+s.t.slice(0,2)+ck.hours&&+s.t.slice(0,2)<h+hours))why="x";
    out.push({h,why});
  }
  return{closed:false,out};
}
function nextFree(g){
  const base=new Date();
  for(let i=0;i<14;i++){const d=new Date(base.getTime()+i*864e5);const ds=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
    const r=slotsFor(g,ds,2,-1);if(r.closed)continue;const f=r.out.find(s=>!s.why);if(f)return p2(d.getDate())+"/"+p2(d.getMonth()+1)+" "+p2(f.h)+":00"}
  return "";
}

function nextSession(){
  let best=null;const now=Date.now();
  for(const o of S.orders){if(o.status!=="paid"&&o.status!=="cash")continue;for(const s of o.sessions){const ts=new Date(s.d+"T"+s.t+":00").getTime();if(ts>now&&ts-now<48*36e5&&(!best||ts<best.ts))best={ts,o,s}}}
  return best;
}
function remindHtml(){
  const n=nextSession();if(!n)return"";const g=getG(n.o.id);if(!g)return"";
  return `<div class="remind">${esc(t("remind",{n:g.name,w:n.s.d.split("-").reverse().join("/")+" "+n.s.t}))}</div>`;
}

function renderResults(){
  let a=girls().filter(g=>{
    const e=eff(g),q=F.q.trim().toLowerCase();
    if(q&&!(g.name.toLowerCase().includes(q)||g.tags.some(x=>x.toLowerCase().includes(q))))return false;
    if(F.sec!=="all"&&e.section!==F.sec)return false;
    if(F.max!=="all"&&e.price>+F.max)return false;
    if(F.tag!=="all"&&!g.tags.includes(F.tag))return false;
    if(F.fav&&!S.fav[g.id])return false;
    return true});
  let h="";
  if(!a.length)h=`<p class="sub">${t("noresult")}</p>`;
  else if(F.sort==="sec"){
    for(const k of SEC_ORDER){const items=a.filter(g=>eff(g).section===k);if(items.length)h+=secHead(k)+`<div class="grid">${items.map(card).join("")}</div>`}
  }else{
    const f={rating:(x,y)=>avg(y.id)-avg(x.id),pa:(x,y)=>eff(x).price-eff(y).price,pd:(x,y)=>eff(y).price-eff(x).price}[F.sort];
    h=`<div class="grid" style="margin-top:6px">${a.sort(f).map(card).join("")}</div>`;
  }
  $("results").innerHTML=h;
}

function renderVip(){
  const v=vipTier(),s=spent(),i=VIPS.indexOf(v),nx=VIPS[i+1];
  const pct=nx?Math.min(100,Math.round((s-v.min)/(nx.min-v.min)*100)):100;
  const cnt={};S.orders.filter(o=>o.status!=="cancelled").forEach(o=>cnt[o.id]=(cnt[o.id]||0)+o.sessions.length);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).filter(x=>getG(x[0]));
  $("app").innerHTML=`<h2>${t("vip_t")}</h2><p class="sub">${t("vip_s")}</p>
    <div class="vipc"><div class="muted">${t("spent")}: <b>${fmt(s)}</b></div>
      <div class="big">${t("vt_"+v.k)}${v.off?` · ${v.off}% ${t("off")}`:""}</div>

    ${a.role==="renter"?`<div class="panel"><h3>${esc(t("acct_girl"))}</h3>${ownProfile?`<button class="btn sm" onclick="openAdd()">${t("acct_edit_profile")}</button>`:`<button class="btn sm" onclick="openAdd()">${t("acct_add_profile")}</button>`}</div>`:""}
    ${a.role==="customer"?`<div class="panel"><h3>${t("ord_t")}</h3>${orders.length?orders.map(o=>`<div class="row" style="justify-content:space-between;margin:8px 0"><span>${esc(o.code)} · ${esc((getG(o.id)||{}).name||"")} · ${t("booking_request")}</span><button class="btn ghost sm" onclick="openChat('${esc(o.code)}')">${t("chat_open")}</button></div>`).join(""):`<p class="muted">${t("chat_no_orders")}</p>`}</div>`:""}
    ${a.role==="renter"?renderRenterInbox(a):""}`;
}
function accountAction(mode){
  const name=mode==="register"?$("accName").value.trim():"",dob=mode==="register"?$("accDob").value:"",phone=mode==="register"?$("accPhone").value.trim():"",email=emailKey($("accEmail").value),role=$("accRole").value;
  const err=$("accErr");
  if((mode==="register"&&(!name||!dob||!phone))||!email){err.textContent=t("acct_missing");return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t("acct_bad_email");return}
  if(mode==="register"&&!/^[0-9+\s().-]{8,20}$/.test(phone)){err.textContent=t("acct_missing");return}
  if(mode==="register"&&(!Number.isFinite(accountAge(dob))||accountAge(dob)<0||accountAge(dob)>120)){err.textContent=t("acct_missing");return}
  let a;
  if(mode==="register"){
    if(S.accounts.some(x=>emailKey(x.email)===email)){err.textContent=t("acct_taken");return}
    a={id:"a_"+Date.now().toString(36),name,dob,phone,email,role};
    S.accounts.push(a);
  }else{
    a=S.accounts.find(x=>emailKey(x.email)===email&&x.role===role);
    if(!a){err.textContent=t("acct_notfound");return}
  }
  S.activeAccountId=a.id;save();renderAll();toast("✓ "+a.name);
}
function updateAccount(){
  const a=activeAccount();if(!a||a.role!=="renter")return;
  const name=$("accName").value.trim(),dob=$("accDob").value,phone=$("accPhone").value.trim(),email=emailKey($("accEmail").value);
  if(!name||!dob||!phone||!email)return toast(t("acct_missing"));
  if(!Number.isFinite(accountAge(dob))||accountAge(dob)<0||accountAge(dob)>120||!/^[0-9+\s().-]{8,20}$/.test(phone))return toast(t("acct_missing"));
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast(t("acct_bad_email"));
  if(S.accounts.some(x=>x.id!==a.id&&emailKey(x.email)===email))return toast(t("acct_taken"));
  Object.assign(a,{name,dob,phone,email});const g=S.custom.find(x=>x.ownerId===a.id);if(g)g.name=name;
  save();renderAll();toast(t("acct_profile_saved"));
}
function logoutAccount(){S.activeAccountId=null;save();go("account")}

window.saveChar=function(){

  const tags=$("ncTags").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,5),bio=$("ncBio").value.trim();

  }

window.delChar=function(id){
  const a=activeAccount(),g=S.custom.find(x=>x.id===id);
  if(!a||a.role!=="renter"||!g||g.ownerId!==a.id)return;
  if(delArm!==id){delArm=id;const b=$("delc");if(b)b.textContent=t("delchar2");return}
  S.custom=S.custom.filter(x=>x.id!==id);delete S.imgs[id];delete S.gallery[id];save();delArm="";closeBox();renderAll();
};
const baseOpenProfile=window.openProfile;
function ownsProfile(id){
  const a=activeAccount(),g=getG(id);
  return !!(a&&a.role==="renter"&&g&&g.ownerId===a.id);
}
window.chImg=function(id){
  if(!ownsProfile(id))return;
  fileImg(700,u=>{S.imgs[id]=u;save();renderAll();toast("✓")});
};
window.addPic=function(id){
  if(!ownsProfile(id))return;
  fileImg(640,u=>{(S.gallery[id]=S.gallery[id]||[]).push(u);save();openProfile(id,pics(getG(id)).length-1)});
};
window.delPic=function(id,i){
  if(!ownsProfile(id)||!S.gallery[id])return;
  S.gallery[id].splice(i,1);save();openProfile(id,0);
};
function guardProfileEditControls(){
  document.querySelectorAll('button[onclick^="chImg("]').forEach(b=>{
    const m=b.getAttribute("onclick").match(/^chImg\('([^']+)'\)$/);
    if(m&&!ownsProfile(m[1]))b.hidden=true;
  });
  const g=getG(curP),canEdit=!!(g&&ownsProfile(curP));
  if(!$("ov").hidden){
    const del=$("delc");if(del&&!canEdit)del.remove();
    if(!canEdit)$("box").querySelectorAll(".thumbs .del").forEach(b=>b.remove());
    if(!canEdit){
      const add=[...$("box").querySelectorAll(".thumbs button")].find(b=>b.textContent.includes(t("addphoto")));
      if(add)add.remove();
    }

window.openProfile=function(id,idx){
  baseOpenProfile(id,idx);const g=getG(id),a=activeAccount();
  if(!g)return;
  const real=g.profileType==="real";
  $("box").insertAdjacentHTML("beforeend",`<p class="notice">${real?t("acct_renter_note"):t("chat_ai")}</p>${real&&a&&a.id===g.ownerId?`<button class="btn ghost sm" onclick="openAdd()">${t("acct_edit_profile")}</button>`:""}`);
  guardProfileEditControls();
};
function renderRenterInbox(a){
  const own=S.custom.filter(g=>g.ownerId===a.id),orders=S.orders.filter(o=>own.some(g=>g.id===o.id)&&o.status!=="cancelled");
  if(!orders.length)return `<div class="panel"><h3>${t("chat_inbox")}</h3><p class="muted">${t("chat_no_orders")}</p></div>`;
  return `<div class="panel"><h3>${t("chat_inbox")}</h3>${orders.map(o=>`<div class="row" style="justify-content:space-between;margin:8px 0"><span>${esc((getG(o.id)||{}).name||"")} · ${esc(o.code)}</span><button class="btn ghost sm" onclick="openChat('${esc(o.code)}')">${t("chat_open")}</button></div>`).join("")}</div>`;
}
function canOpenChat(o,a){
  if(!o||!a)return false;
  return !!(o.cust&&o.cust.accountId===a.id)||!!(getG(o.id)&&getG(o.id).ownerId===a.id);
}
window.openChat=function(code){
  const a=activeAccount(),o=S.orders.find(x=>x.code===code);
  if(!canOpenChat(o,a)){toast(t("acct_demo"));return}
  currentChat=code;view="chat";renderAll();
};
function renderChatPage(){
  const a=activeAccount(),o=S.orders.find(x=>x.code===currentChat),g=o&&getG(o.id);
  if(!canOpenChat(o,a)||!g){$("app").innerHTML=`<p class="notice">${t("chat_demo")}</p>`;return}
  const msgs=S.chats[o.code]||[];
  $("app").innerHTML=`<h2>${t("chat_title")} · ${esc(g.name)}</h2><p class="notice">${t("chat_demo")}</p>
    <div class="panel"><p class="muted">${t(g.profileType==="real"?"chat_human":"chat_ai")}</p>
      <div id="chatBody" style="max-height:45vh;overflow:auto">${msgs.map(m=>`<div class="rev"><b>${esc(m.from===a.id?a.name:m.label||t("chat_title"))}</b><div>${esc(m.text)}</div><small class="muted">${esc(m.at||"")}</small></div>`).join("")}</div>
      ${a.role==="customer"||(a.role==="renter"&&g.ownerId===a.id)?`<div class="r2"><input class="inp" id="chatInput" maxlength="500" placeholder="${esc(t("chat_placeholder"))}" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn sm" onclick="sendChat()">${t("chat_send")}</button></div>`:`<p class="muted">${t("chat_human")}</p>`}
      <button class="btn ghost sm" style="margin-top:10px" onclick="go('orders')">${t("ck_back")}</button>
    </div>`;
}
window.sendChat=function(){
  const a=activeAccount(),o=S.orders.find(x=>x.code===currentChat),g=o&&getG(o.id),input=$("chatInput");
  const owner=!!(a&&g&&a.role==="renter"&&g.ownerId===a.id);
  if(!a||(!owner&&a.role!=="customer")||!canOpenChat(o,a)||!input)return;
  const text=input.value.trim();if(!text)return;
  const arr=S.chats[o.code]=S.chats[o.code]||[];
  arr.push({from:a.id,label:a.name,text,at:new Date().toLocaleString()});input.value="";save();renderChatPage();
  if(owner)return;
  if(!g||g.profileType==="real"){toast(t("chat_human"));return}
  const replies=[t("chat_reply1"),t("chat_reply2"),t("chat_reply3")];
  setTimeout(()=>{if(!S.chats[o.code])S.chats[o.code]=[];S.chats[o.code].push({from:"demo-ai",label:g.name,text:replies[S.chats[o.code].length%replies.length],at:new Date().toLocaleString()});save();if(view==="chat"&&currentChat===o.code)renderChatPage()},650);
};
window.ordStatus=function(o){
