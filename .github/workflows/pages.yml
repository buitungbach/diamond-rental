name: Publish VELORA website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp "Diamond Rental.html" _site/index.html
          cp "Diamond Rental.html" "_site/Diamond Rental.html"
          cp supabase-config.js supabase-app.js diamond-payment-qr.png velora-logo.png velora-icon-180.png velora-icon-192.png velora-icon-512.png velora-logo-v2.png velora-icon-180-v2.png velora-icon-192-v2.png velora-icon-512-v2.png sw.js manifest.webmanifest _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
